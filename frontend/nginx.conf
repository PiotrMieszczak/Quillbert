server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Uploads (POST /documents). The app enforces its own limit (MAX_UPLOAD_MB, 200);
        # behind Cloudflare Free the effective cap is 100 MB.
        client_max_body_size 200m;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # API docs and the schema are not proxied: the public site serves only the SPA and /api/.
    # Locally they are on the backend port (http://localhost:8000/docs, ENABLE_API_DOCS=true).

    location / {
        try_files $uri $uri/ /index.html;
    }
}
