services:
  # Develop against a Supabase project (set DATABASE_URL in a .env file). There is no
  # local Postgres on purpose: Supabase gives the same Auth, RLS and pgvector as
  # production, so there is no "works locally, breaks in prod" divergence. Use a
  # separate Supabase *dev* project once you have real data to protect.
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL — a Supabase session-pooler URL (postgresql+psycopg://…)}
      OPEN_ROUTER_API_KEY: ${OPEN_ROUTER_API_KEY:-}
      SUPABASE_URL: ${VITE_SUPABASE_URL:-}
      # Swagger UI and ReDoc; false unless your .env turns them on (never set in production).
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      # Uploaded files (the local-disk FileStore); kept across restarts on a named volume.
      FILE_STORE_PATH: /data/files
    # No command override: the image serves uvicorn. Migrations are NOT run on boot —
    # apply them yourself with `alembic upgrade head` (and `python -m
    # app.adapters.persistence.sqlalchemy.seed` for the dev campaign). Production
    # migrates via the Migrate-database CI workflow.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - files:/data/files
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  files:
