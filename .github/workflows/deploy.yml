name: Deploy

# Deploy to ted106 through Openship once CI is green on main.
#
# Openship's control plane runs on the maintainer's Mac (127.0.0.1) — GitHub-hosted
# runners cannot reach it. This job therefore runs on a self-hosted runner installed on
# that Mac, which is already logged in to Openship (`openship login`); no secrets needed.
# If the Mac is off the job queues until it is back. Runner setup: docs/setup-guide.md.
#
# Runs only on pushes to main (workflow_run of CI on main), never on PRs or forks —
# a self-hosted runner must not execute untrusted code.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

# Never cancel a deploy mid-run.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, macOS, openship]
    timeout-minutes: 20
    steps:
      - name: openship deploy
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: openship deploy --project proj_cGL8BrBLA8VtUdF5 --branch main --commit "$SHA" --watch
