name: Deploy

# Deploy a release to ted106 through Openship. Called by release-please.yml after
# Migrate, with the release commit; or run by hand (workflow_dispatch deploys main).
#
# Openship's control plane runs on the maintainer's Mac (127.0.0.1) — GitHub-hosted
# runners cannot reach it. This job therefore runs on a self-hosted runner installed on
# that Mac, which is already logged in to Openship (`openship login`); no secrets needed.
# If the Mac is off the job queues until it is back. Runner setup: docs/setup-guide.md.
#
# Only main-branch workflows call it, never PRs or forks — a self-hosted runner must not
# execute untrusted code.

on:
  workflow_call:
    inputs:
      sha:
        type: string
        required: true
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: [self-hosted, macOS, openship]
    timeout-minutes: 20
    # Never cancel a deploy mid-run.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: openship deploy
        env:
          SHA: ${{ inputs.sha || github.sha }}
        run: openship deploy --project proj_cGL8BrBLA8VtUdF5 --branch main --commit "$SHA" --watch
