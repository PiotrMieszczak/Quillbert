name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs CI on the release commit before migrating and deploying.
  workflow_call: {}

# A newer push to the same ref cancels the older run. When called, github.workflow is the
# caller's name, so a release's CI gets its own group and is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'CI' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # frontend/ does not exist on every branch yet. Skip rather than fail.
      - id: check
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No frontend/ on this ref — skipping build, test, and lint."
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: steps.check.outputs.present == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: steps.check.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Test
        if: steps.check.outputs.present == 'true'
        working-directory: frontend
        run: npm test

      # Build last: typecheck runs here (tsc -b), so lint and test failures
      # surface first and faster.
      - name: Build
        if: steps.check.outputs.present == 'true'
        working-directory: frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dm
          POSTGRES_PASSWORD: dm
          POSTGRES_DB: dm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dm -d dm_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - id: check
        run: |
          if [ -f backend/pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No backend/ on this ref — skipping lint, test, and import contracts."
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.present == 'true'
        with:
          python-version: "3.11"

      - name: Install
        if: steps.check.outputs.present == 'true'
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Lint
        if: steps.check.outputs.present == 'true'
        working-directory: backend
        run: ruff check app tests

      - name: Import contracts
        if: steps.check.outputs.present == 'true'
        working-directory: backend
        run: lint-imports

      - name: Test
        if: steps.check.outputs.present == 'true'
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://dm:dm@localhost:5432/dm_test
        run: pytest -rs
