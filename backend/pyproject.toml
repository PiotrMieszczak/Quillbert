[project]
name = "dm-assistant-backend"
version = "0.0.0"
description = "FastAPI backend for Quillbert"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "PyJWT[crypto]>=2.9",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "import-linter>=2.1",
  "pytest>=8.3",
  "ruff>=0.9",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "Hexagon: domain imports nothing else in app"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
  "app.ports",
  "app.application",
  "app.adapters",
  "app.entrypoints",
  "app.composition",
  "app.config",
]

[[tool.importlinter.contracts]]
name = "Hexagon: application does not import adapters or entrypoints"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = ["app.adapters", "app.entrypoints"]

[[tool.importlinter.contracts]]
name = "Hexagon: adapters do not import application or entrypoints"
type = "forbidden"
source_modules = ["app.adapters"]
forbidden_modules = ["app.application", "app.entrypoints"]

[[tool.importlinter.contracts]]
name = "Hexagon: entrypoints do not import adapters"
type = "forbidden"
source_modules = ["app.entrypoints"]
forbidden_modules = ["app.adapters"]
